# 一条命令起全套：docker compose up -d --build
#   后端 http://localhost:8000/docs
#   前端 http://localhost:8501

services:
  api:
    build: .
    image: rag-kb:latest
    container_name: rag-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # 向量库和上传文件落在宿主机，容器删了也不丢
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    image: rag-kb:latest          # 复用 api 构建出来的镜像，不用重复 build
    container_name: rag-ui
    command:
      - streamlit
      - run
      - app/ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_BASE_URL: http://api:8000   # 容器之间用服务名互访，不是 localhost
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
